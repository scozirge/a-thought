<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木塊出走</title><link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css"><script defer src="levels.js"></script><script defer src="core.js"></script><script defer src="app.js"></script></head>
<body><main class="app"><header><div class="brand"><span class="brand-mark" aria-hidden="true">▰</span> 木塊出走</div><span class="version">v0.4.3</span></header><nav id="levels" aria-label="選關卡"></nav>
<section class="game-panel"><div class="game-heading"><div><p id="stage"></p><h1>移出紅色木塊</h1></div><div class="counter"><span>剩餘步數</span><strong id="remaining"></strong></div></div>
<div class="board-wrap"><div class="exit-label" aria-hidden="true">出口 <span>→</span></div><div class="frame"><div class="exit-gap" aria-hidden="true"></div><div id="board" aria-label="六乘六木塊棋盤"></div></div></div>
<div class="under-board"><span>一次拖動算 1 步</span><span id="best"></span></div><div class="bottom"><p id="status" role="status" aria-live="polite"></p><div class="controls"><button id="undo">↶ 退一步</button><button id="reset">重新開始</button></div></div></section>
<section id="answers" class="answers" aria-labelledby="answer-title" hidden></section>
</main><dialog id="win" aria-labelledby="win-title"><div class="win-picture" aria-hidden="true"><i></i><span>→</span></div><p id="win-stage"></p><h2 id="win-title">出來了！</h2><p id="win-score"></p><div class="controls"><button id="stay">再看看</button><button id="next" class="primary">下一關 →</button></div></dialog></body></html>
