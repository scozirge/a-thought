<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#284e40">
  <meta name="description" content="安排小塔、改變路線，和小蟲一起學方向、數量與策略。">
  <title>小小守園隊</title>
  <link rel="stylesheet" href="styles.css?v=31bc68023e2b">
</head>
<body>
  <main class="app" aria-label="小小守園隊">
    <header class="hud">
      <h1><svg class="crest" viewBox="0 0 40 44" aria-hidden="true"><path d="m20 2 16 5v15c0 9-10 16-16 20C14 38 4 31 4 22V7Z" fill="#f7cf73" stroke="#143c32" stroke-width="2"/><path d="m20 6 12 4v12c0 6-6 12-12 16C14 34 8 28 8 22V10Z" fill="#477c5b"/><path d="M18 28C7 27 10 18 10 18q9-2 11 9C16 18 21 12 29 12c1 9-4 15-9 16l-1 5-3-1Z" fill="#ffe7a1"/></svg><span>小小守園隊</span></h1>
      <select id="level-select" aria-label="測試選關，切換會重設盤面" title="測試選關：切換會重設盤面"></select>
      <div class="resources">
        <div class="heart-count" id="hearts" aria-label="城堡生命 5"><span data-icon="heart"></span><strong id="health">5</strong></div>
        <div class="coin-count" id="coins" aria-label="可用金幣 48"><span data-icon="coin"></span><strong id="money">48</strong></div>
        <div id="crystals" class="item-count" title="升級水晶" hidden><span data-icon="crystal"></span><strong id="upgrade-count">0</strong></div>
        <div id="hammers" class="item-count" title="融合槌" hidden><span data-icon="hammer"></span><strong id="hammer-count">0</strong></div>
      </div>
      <details class="display-settings">
        <summary aria-label="顯示設定" title="顯示設定"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><g class="icon-line"><path d="M3 7h6m5 0h7M3 17h11m5 0h2"/><circle cx="11.5" cy="7" r="2.5"/><circle cx="16.5" cy="17" r="2.5"/></g></svg></summary>
        <div class="settings-options">
          <label><input id="route-toggle" type="checkbox" checked autocomplete="off">顯示蟲蟲進攻路線</label>
          <label><input id="enemy-health" type="checkbox" checked autocomplete="off">顯示蟲蟲血量</label>
          <p class="status-help">冰凍第 1～6 層依序變慢 10%、12%、14%、16%、18%、20%。第 7 層凍住 1.5 秒，蟲王凍住 0.5 秒。緩速消退時層數歸零。解凍後 1 秒內不會變慢或再結凍，之後才能重新疊冰。</p>
          <p class="status-help">燃燒中再次點燃會立刻扣 1 血，並刷新時間。</p>
        </div>
      </details>
    </header>
    <section class="field-panel" aria-label="花園戰場">
        <svg id="board" viewBox="0 0 920 592" role="group" aria-label="戰場。選好工具後點草地放置，或用方向鍵移動、Enter 放置。">
          <defs id="garden-art"></defs>
          <g id="ground-layer"></g><g id="route-layer" pointer-events="none" aria-hidden="true"></g><g id="fire-layer" pointer-events="none" clip-path="url(#field-bounds)"></g><g id="range-layer" pointer-events="none"></g>
          <g id="home-layer" pointer-events="none"></g><g id="building-layer" pointer-events="none"></g><g id="bug-layer" pointer-events="none"></g>
          <g id="shot-layer" pointer-events="none"></g><g id="effects-layer" pointer-events="none"></g><g id="health-layer" pointer-events="none"></g>
          <g id="hover-layer" pointer-events="none"></g><g id="hit-layer" role="grid" aria-label="建造格子"></g>
          <g id="entrance-layer" role="group" aria-label="蟲蟲入口"></g>
        </svg>
    </section>

    <div class="control-panel" aria-label="防守工具">
      <div id="tools" class="tools"></div>
      <div class="edit-controls">
        <button id="undo" class="icon-button" aria-label="退一步" data-icon="undo" disabled></button>
        <button id="reset" class="icon-button" type="button">重置</button>
        <button hidden id="solution" class="icon-button" aria-label="清空並部署本關解答，重設本關預算" title="重設本關，放上預算內的解答">解答</button>
      </div>
      <div class="round-actions">
        <button id="replay" class="action-button" type="button" hidden>此關再玩一次</button>
        <button id="action" class="action-button" aria-label="開始" data-icon="play"></button>
      </div>
    </div>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <div id="tower-info" class="tower-info" role="tooltip" hidden></div>
  <dialog id="entry-guide" aria-labelledby="entry-guide-title" aria-describedby="entry-guide-location">
    <header class="guide-heading">
      <div><h2 id="entry-guide-title">入口蟲蟲</h2><p id="entry-guide-location"></p></div>
      <button type="button" id="entry-guide-close" aria-label="關閉入口蟲蟲" autofocus>×</button>
    </header>
    <div id="entry-cards"></div>
    <nav id="entry-pages" aria-label="蟲蟲圖鑑分頁" hidden>
      <button id="entry-prev" type="button" aria-label="上一頁" aria-controls="entry-cards">‹</button>
      <span id="entry-page-count" role="status"></span>
      <button id="entry-next" type="button" aria-label="下一頁" aria-controls="entry-cards">›</button>
    </nav>
  </dialog>

  <div id="building-menu" tabindex="-1" role="group" aria-labelledby="building-name" hidden>
    <strong id="building-name"></strong>
    <button id="edit-close" type="button" aria-label="關閉升級面板" title="關閉"><span aria-hidden="true">×</span></button>
    <div class="building-actions">
      <button id="edit-grade"></button>
      <button id="fusion-locked" type="button" aria-disabled="true" data-unavailable="合成槌不足" hidden><span data-icon="hammer"></span>合成</button>
      <div id="fusion-options" role="group" aria-labelledby="fusion-label" hidden>
        <span id="fusion-label"></span>
        <div id="fusion-recipes"></div>
      </div>
      <button id="edit-move" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20M8 6l4-4 4 4M8 18l4 4 4-4M6 8l-4 4 4 4M18 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>移動</button>
      <button id="edit-remove"><span data-icon="erase"></span>拆除</button>
    </div>
  </div>
  <dialog id="lesson" aria-labelledby="lesson-title">
    <h2 id="lesson-title"></h2>
    <div id="lesson-steps"></div>
    <p id="lesson-cost"></p>
    <button id="lesson-close" class="action-button" autofocus>開始部署</button>
  </dialog>
  <dialog id="result" aria-labelledby="result-title">
    <div class="result-illustration" id="result-art"></div>
    <h2 id="result-title">守住了！</h2>
    <div id="win-crystal" class="victory-loot" hidden></div>
    <p id="bonus-invite" hidden></p>
    <div id="result-hearts" class="result-hearts"></div>
    <section id="castle-hits" aria-labelledby="castle-hits-title" hidden>
      <h3 id="castle-hits-title">讓城堡扣血的蟲</h3>
      <ol id="castle-hit-list"></ol>
    </section>
    <button id="result-primary" class="action-button" autofocus>再玩一次</button>

  </dialog>
  <script src="core.js?v=31bc68023e2b"></script><script src="solutions.js?v=31bc68023e2b"></script><script src="art.js?v=31bc68023e2b"></script><script src="app.js?v=31bc68023e2b"></script>
</body>
</html>
