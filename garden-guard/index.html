<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ed">
  <meta name="description" content="安排小塔、改變路線，和小蟲一起學方向、數量與策略。">
  <title>小小守園隊</title>
  <link rel="stylesheet" href="styles.css?v=2b481c1e2f48">
</head>
<body>
  <main class="app" aria-label="小小守園隊">
    <section class="field-panel" aria-label="花園戰場">
      <header class="hud">
        <nav class="levels" aria-label="選擇花園">
          <button data-level="0" aria-label="花園一：青草地">1</button>
          <button data-level="1" aria-label="花園二：小池塘">2</button>
          <button data-level="2" aria-label="花園三：兩條路">3</button>
        </nav>
        <div class="resources">
          <div class="heart-count" id="hearts" aria-label="小屋生命 5"><span data-icon="heart"></span><strong id="health">5</strong></div>
          <div class="seed-count" id="seeds" aria-label="可用種子 22"><span data-icon="seed"></span><strong id="money">22</strong></div>
        </div>
      </header>
      <div class="board-scroll" id="board-scroll">
        <svg id="board" viewBox="0 0 920 592" role="group" aria-label="戰場。選好工具後點草地放置，或用方向鍵移動、Enter 放置。">
          <defs>
            <pattern id="grass" width="29" height="29" patternUnits="userSpaceOnUse"><path d="m7 18 2-4 2 4m13-9 1-3" stroke="#597853" stroke-opacity=".07" stroke-width="1.2" fill="none"/></pattern>
          </defs>
          <g id="ground-layer"></g><g id="fire-layer" pointer-events="none"></g><g id="range-layer" pointer-events="none"></g>
          <g id="building-layer" pointer-events="none"></g><g id="bug-layer" pointer-events="none"></g>
          <g id="shot-layer" pointer-events="none"></g><g id="effects-layer" pointer-events="none"></g>
          <g id="hover-layer" pointer-events="none"></g><g id="hit-layer" role="grid" aria-label="建造格子"></g>
        </svg>
      </div>
    </section>

    <div class="control-panel" aria-label="防守工具">
      <div id="tools" class="tools"></div>
      <div class="edit-controls">
        <button id="undo" class="icon-button" aria-label="退一步" data-icon="undo" disabled></button>
        <button id="remove" class="icon-button" aria-label="移走物品，退回種子" aria-pressed="false" data-icon="erase"></button>
        <button id="reset" class="icon-button" aria-label="重新開始這個花園" data-icon="reset"></button>
      </div>
      <button id="action" class="action-button" aria-label="放小蟲" data-icon="play"></button>
    </div>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <div id="tower-info" class="tower-info" role="tooltip" hidden></div>

  <dialog id="result" aria-labelledby="result-title">
    <div class="result-illustration" id="result-art"></div>
    <h2 id="result-title">守住了！</h2>
    <div id="result-hearts" class="result-hearts"></div>
    <button id="result-primary" class="action-button">下一園</button>
    <button id="result-secondary" class="secondary-button">再玩一次</button>
  </dialog>
  <script src="core.js?v=2b481c1e2f48"></script><script src="art.js?v=2b481c1e2f48"></script><script src="app.js?v=2b481c1e2f48"></script>
</body>
</html>
