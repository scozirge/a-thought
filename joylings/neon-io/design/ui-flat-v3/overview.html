<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Impact · UI 設計總覽</title><link rel="stylesheet" href="gallery.css"><link rel="icon" href="data:,"><style>
body{padding:48px;background:#101b2b}.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:32px;margin-bottom:32px;border-bottom:1px solid #344253}.sheet-head h1{font-size:36px;font-weight:500;margin-top:8px}.sheet-head p{font-size:16px;color:#aab6c5}.sheet-head .stamp{font-size:13px;color:#d6bc7d;letter-spacing:.12em}.comparison{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.concept-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}.concept-head .letter{width:48px;height:48px;display:grid;place-items:center;font-size:24px;background:#d6bc7d;color:#142136;border-radius:3px}.concept-head h2{font-size:26px;font-weight:500}.concept-head small{display:block;color:#aab6c5;font-size:13px;margin-top:4px}.preview-img{display:block;width:100%;height:auto;border:1px solid #344253}.concept p{font-size:16px;line-height:1.9;margin-top:20px;color:#aab6c5}.sheet-foot{border-top:1px solid #344253;margin-top:32px;padding-top:24px;display:flex;justify-content:space-between;gap:24px;color:#aab6c5;font-size:13px}.details{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}.detail-label{font-size:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}.detail-label span{font-size:13px;color:#aab6c5}.detail p{font-size:14px;color:#aab6c5;margin-top:16px;line-height:1.9}.full>.detail-label{margin-bottom:16px}.detail img{border:1px solid #344253}.spec{color:#d6bc7d!important}
</style></head><body><div id="sheet"></div><script>
const v=new URLSearchParams(location.search).get('variant');const variants={a:['留白構圖','主入口靠左，美術靠右。','細線與留白，把金色留給主要操作。'],b:['競技面板','模式並列，操作列靠下。','直角與緊湊數值，適合快速進出對戰。'],c:['柔和卡片','模式分區，卡片靠右。','純色色塊與圓角，整理收藏和配裝資訊。']};
const heading=(title,note)=>`<header class="sheet-head"><div><span class="eyebrow">NEON IMPACT / UI DESIGN STUDY</span><h1>${title}</h1></div><p>${note}</p></header>`;
const foot=`<footer class="sheet-foot"><span>沿用原始平面美術與技能圖。畫面與數字為設計示意，尚未更換正式遊戲。</span><span>互動比較：scozirge.github.io/a-thought/neon-impact-design/ui-flat-v3/</span></footer>`;
document.getElementById('sheet').innerHTML=variants[v]?heading(`${v.toUpperCase()} · ${variants[v][0]}`,'午夜藍 × 香檳金 / 扁平介面')+`<section class="full"><div class="detail-label">大廳<span>電腦版 1440 × 900</span></div><img class="preview-img" src="screens/${v}-lobby-desktop.png" alt="大廳設計"></section><section class="details"><article class="detail"><div class="detail-label">戰鬥介面<span>資訊留在邊緣</span></div><img class="preview-img" src="screens/${v}-battle-desktop.png" alt="戰鬥設計"><p>生命值與技能狀態優先；排行榜與擊殺紀錄降低視覺權重。藍色標示我方，紅色標示敵方。</p></article><article class="detail"><div class="detail-label">手機橫向教學<span>844 × 390</span></div><img class="preview-img" src="screens/${v}-tutorial-phone.png" alt="手機橫向教學"><p>手機重新分欄，保留完整文字，不把桌面畫面整張縮小。</p><p class="spec">正文 16 px / 翻頁觸控高度至少 44 px</p></article></section>`+foot:heading('三版扁平 UI，三種資訊節奏。','同一套素材 / 同一套色彩 / 不同操作配置')+`<section class="comparison">${Object.entries(variants).map(([key,data])=>`<article class="concept"><div class="concept-head"><span class="letter">${key.toUpperCase()}</span><div><h2>${data[0]}</h2><small>${data[1]}</small></div></div><img class="preview-img" src="screens/${key}-lobby-desktop.png" alt="${data[0]}大廳"><p>${data[2]}</p></article>`).join('')}</section>`+foot;
</script></body></html>
