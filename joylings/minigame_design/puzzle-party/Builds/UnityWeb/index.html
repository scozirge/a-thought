<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><title>一起想想｜四組合作解謎</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#f5f5ed;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#315648}canvas{display:block;width:100vw;height:100dvh;touch-action:none;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#f5f5ed;gap:14px}progress{width:280px;height:16px;accent-color:#386f59}p,small{font-size:18px}small{color:#596b55}#error{max-width:640px;padding:24px;white-space:pre-wrap}</style></head>
<style>
dialog{width:min(620px,calc(100vw - 24px));max-height:calc(100dvh - 28px);overflow:auto;border:1px solid #cbd8c5;border-radius:20px;padding:24px;background:#fffef8;color:#294e45;font:18px/1.6 system-ui,"Microsoft JhengHei",sans-serif}dialog::backdrop{background:#17372e75}dialog h2{font-size:28px;margin:0 0 10px}dialog p{margin:10px 0 18px}dialog label{display:block;margin:12px 0 5px;font-weight:600}dialog input,dialog select,dialog button{font:inherit;font-size:20px;min-height:48px;border:1px solid #c5d3be;border-radius:9px;padding:9px 12px;color:#294e45;background:white}dialog input,dialog select{width:100%}dialog button{cursor:pointer}dialog button:disabled{opacity:.55;cursor:wait}.room-primary{background:#306d5c;color:white;border-color:#306d5c}.room-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.room-row button{flex:1}.room-divider{border-top:1px solid #dbe2d4;margin:22px 0 12px;padding-top:16px}.room-number{font-size:42px;letter-spacing:6px;color:#306d5c;font-weight:750}.room-members{padding:0;list-style:none}.room-members li{padding:9px 12px;margin:8px 0;border-radius:9px;background:#edf3e7}.room-error{color:#a84127;min-height:29px}#room-close{float:right;border:0;background:#edf2e5;padding:4px 14px}#room-wait{color:#557646}dialog [hidden]{display:none!important}
</style>
<body><canvas id="unity-canvas" tabindex="0" aria-label="一起想想：兩款各 20 關，四組各選一次"></canvas><div id="loading"><h1>一起想想</h1><p>正在準備兩款遊戲與 40 個小挑戰…</p><progress id="progress" max="1" value="0"></progress><small>可單機代答，也能開房一起玩。</small><div id="error"></div></div>
<dialog id="room-dialog" aria-labelledby="room-title">
 <button id="room-close" aria-label="關閉連線視窗">×</button><h2 id="room-title">連線教室</h2>
 <div id="room-form"><p>老師開房，三組學生輸入房號加入。<br>每組選一次，老師按播放，大家一起看結果。</p>
 <label for="room-name">你的稱呼</label><input id="room-name" maxlength="16" placeholder="例如：王老師、小兔組" autocomplete="nickname">
 <div class="room-row"><button class="room-primary" id="room-create">我是老師 · 建立房間</button></div>
 <div class="room-divider">我是學生</div><label for="room-code">六位房號</label><input id="room-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="輸入老師的房號" autocomplete="off">
 <label for="room-group">我是第幾組</label><select id="room-group"><option value="0">第 1 組</option><option value="1">第 2 組</option><option value="2">第 3 組</option></select>
 <div class="room-row"><button class="room-primary" id="room-join">加入房間</button></div>
 </div>
 <div id="room-connected" hidden><p id="room-identity"></p><div>請學生輸入這個房號</div><div class="room-number" id="room-number"></div><ul id="room-members" class="room-members"></ul><p>缺席的組別，老師可以代答。老師離開時，房間就會結束。</p><div class="room-row"><button id="room-copy">複製房號</button><button id="room-leave">離開房間</button></div></div>
 <p id="room-wait" role="status"></p><p id="room-error" class="room-error" role="alert"></p>
</dialog>
<script>
(()=>{const el=id=>document.getElementById(id),dialog=el('room-dialog');let lastConnected=false;
 window.puzzleOpenRoom=()=>{if(!dialog.open)dialog.showModal();};
 const send=request=>{if(!window.unityInstance)return;el('room-error').textContent='';el('room-wait').textContent='正在連線…';window.unityInstance.SendMessage('PuzzleParty','RoomCommand',JSON.stringify(request));};
 el('room-close').onclick=()=>{dialog.close();document.getElementById('unity-canvas').focus();};
 el('room-create').onclick=()=>send({type:'create',name:el('room-name').value||'老師',group:3});
 el('room-join').onclick=()=>{const code=el('room-code').value.trim();if(!/^[0-9]{6}$/.test(code)){el('room-error').textContent='請輸入六位數字房號。';return;}const group=Number(el('room-group').value);send({type:'join',code,name:el('room-name').value||'第 '+(group+1)+' 組',group});};
 el('room-leave').onclick=()=>send({type:'leave'});
 el('room-copy').onclick=async()=>{try{await navigator.clipboard.writeText(window.puzzleRoomState.code);el('room-wait').textContent='已複製房號，傳給其他組就可以了。';}catch{el('room-wait').textContent='房號：'+window.puzzleRoomState.code;}};
 window.puzzleRenderRoom=s=>{el('room-form').hidden=s.connected;el('room-connected').hidden=!s.connected;el('room-error').textContent=s.error||'';
  for(const id of ['room-create','room-join','room-leave'])el(id).disabled=s.busy;
  if(s.busy)el('room-wait').textContent='正在連線，請稍等…';else if(el('room-wait').textContent.startsWith('正在'))el('room-wait').textContent='';
  if(s.connected){el('room-number').textContent=s.code;el('room-identity').textContent=s.isHost?'你是老師組，可代填全部四組。':'你是第 '+(s.myGroup+1)+' 組，只設定自己的那一格。';
   const list=el('room-members');list.replaceChildren();for(let group=0;group<4;group++){const m=(s.members||[]).find(m=>m.group===group),li=document.createElement('li');li.textContent=(group===3?'老師組':'第 '+(group+1)+' 組')+'：'+(m?m.name+' · 已加入':'尚未加入 · 老師可代答');list.append(li);}
   if(!lastConnected){dialog.close();document.getElementById('unity-canvas').focus();}
  }else if(lastConnected||s.error){if(!dialog.open)dialog.showModal();}
  lastConnected=s.connected;
 };
 const code=new URL(location.href).searchParams.get('room');if(code&&/^[0-9]{6}$/.test(code)){el('room-code').value=code;window.addEventListener('puzzle-ready',()=>window.puzzleOpenRoom());}
})();
</script>
<script src="Build/UnityWeb.loader.js?v=833175818595"></script><script>
const canvas=document.getElementById('unity-canvas');
createUnityInstance(canvas,{dataUrl:'Build/UnityWeb.data?v=d3bdc149eee7',frameworkUrl:'Build/UnityWeb.framework.js?v=f1babedf4176',codeUrl:'Build/UnityWeb.wasm?v=da8b812ba451',streamingAssetsUrl:'StreamingAssets',companyName:'AThought',productName:'一起想想',productVersion:'0.10.1',devicePixelRatio:1},p=>document.getElementById('progress').value=p).then(instance=>{window.unityInstance=instance;
canvas.addEventListener('wheel',e=>{instance.SendMessage('PuzzleParty','Scroll',String(e.deltaY));e.preventDefault();},{passive:false});
let lastTouchY=null;
canvas.addEventListener('touchstart',e=>{lastTouchY=e.touches[0]?.clientY??null;},{passive:true});
canvas.addEventListener('touchmove',e=>{const y=e.touches[0]?.clientY;if(lastTouchY!==null&&y!==undefined&&Math.abs(lastTouchY-y)>4){instance.SendMessage('PuzzleParty','Scroll',String(lastTouchY-y));lastTouchY=y;e.preventDefault();}},{passive:false});
canvas.addEventListener('touchend',()=>{lastTouchY=null;},{passive:true});document.getElementById('loading').remove();canvas.focus();window.dispatchEvent(new Event('puzzle-ready'));}).catch(e=>{document.getElementById('error').textContent='載入失敗：'+e+'\n請重新整理，或使用附的「開始 Unity 測試.cmd」。';console.error(e);});
</script></body></html>
