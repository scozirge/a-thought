/* 四組分工、旋轉貼紙與同步滑行。 */
.layer-arrow{color:#98a58f;align-self:center;font-size:12px}
.system-turn{background:#f0e8f8;border-color:#ceb8e4;color:#7955a0}
.system-turn.applied{background:#eee0f8;border-color:#ba9bcc;color:#7955a0}
.turning-board{will-change:transform;position:relative;z-index:2}
.monster-plan{border:1px solid #e2d2b7;background:#faf3e7;padding:12px;border-radius:11px;margin-bottom:12px}
.monster-plan p{font-size:12px;line-height:1.8;color:#7b6346}
.world-events{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
.world-event{display:flex;flex-direction:column;gap:4px;background:#fffdf7;border:1px solid #e0cfb4;border-radius:8px;padding:7px 10px;font-size:12px;flex:1;min-width:92px;color:#7d684e}
.event-state{font-size:10px;color:#a6937d}
.world-event.current{outline:2px solid #d29140;background:#ffe6b7}
.world-event.played{background:#f3ecd9}
.world-event.cancelled{background:#e6efdd;border-color:#b6cea7;color:#456b42}
.world-event.cancelled .event-state{color:#456b42;font-weight:700}
.event-legend{font-size:11px;color:#907958;line-height:1.7}
.ice-config .options{grid-template-columns:repeat(var(--options,4),minmax(0,1fr))!important}
.game-heading{flex-wrap:wrap}
.portal-rule{font-size:13px;line-height:1.8;background:#f0e8f8;color:#7955a0;border:1px solid #d9c6eb;border-radius:10px;padding:10px 12px;margin:0 0 12px}
.warp-ring.warping ellipse:first-child{fill:#dcc0fb;stroke:#7647a8;stroke-width:6}
@media(min-width:681px){.game-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.game-card:nth-child(3) .card-art{background:#e3f0f2}
.progress-dots{flex-wrap:wrap}.dot{flex-shrink:0}
.levels{flex-wrap:wrap;max-width:100%}
.sticker-output-wrap{position:relative;max-width:220px;margin:auto}
.rotating-stamp{position:absolute;inset:0;z-index:2;filter:drop-shadow(0 3px 5px #3c473752);pointer-events:none}
.rotating-stamp .mask{width:100%;height:100%;padding:8px;gap:5px;border:1px solid transparent;border-radius:13px;background:transparent}
.rotating-stamp .mask-cell{background:transparent;border-color:transparent;border-radius:7px}
.rotating-stamp .ink{opacity:.94}
.rotation-config .mask{width:65px}
.turn-option{font-size:12px;min-width:54px}
.ice-mission{font-size:13px;color:#587583;line-height:1.9;margin:0 0 14px;text-align:center}
.ice-mission strong{display:block;font-weight:500}
.ice-boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0 22px}
.ice-boards.single{grid-template-columns:minmax(0,300px);justify-content:center}
.ice-title{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12px;margin:0 4px 8px}
.ice-title>span:first-child{color:var(--scarf);font-weight:700}
.ice-arrived{color:#7e919a;font-size:11px}
.ice-arrived.home{color:#38734f}
.ice-world{width:100%;height:auto;overflow:visible}
.ice-sequence{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:17px}
.ice-step{background:#eef4f3;border:1px solid #cfdddd;border-radius:10px;min-width:60px;padding:7px;text-align:center}
.ice-step small{display:block;font-size:11px;color:#6a8185}
.ice-step b{display:block;font-size:26px;color:#406a7a;line-height:1.3}
.ice-step.played{background:#e4efdf;border-color:#bcd1b8}
.ice-step.current{outline:2px solid #c3a34f;background:#fff2ca}
.ice-next{color:#94a9a8;font-size:13px}
.ice-config .options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.ice-option{min-width:0;padding:8px 5px;font-size:12px;gap:3px}
.ice-option.selected{padding:7px 4px}
.ice-option b{font-size:20px;font-weight:500}
.ice-option.selected:after{position:absolute;right:2px;top:0;font-size:9px}
.group-description{margin-left:auto;color:#8b978b;font-size:11px;font-weight:400}
@media(max-width:680px){
  .levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;gap:7px}
  .sticker-output-wrap{max-width:160px}
  .rotation-config .mask{width:54px}
  .turn-option{min-width:49px;padding:8px 6px}
  .turn-option.selected{padding:7px 5px}
  .ice-config{grid-template-columns:1fr}
  .ice-boards{gap:10px}
  .ice-title{font-size:12px}
  .ice-sequence{gap:6px}
  .ice-step{min-width:50px;padding:6px}
}
@media(max-width:360px){
  .tag{font-size:10px;padding:5px 7px}
  .game-card{grid-template-columns:95px minmax(0,1fr)}
  .card-body{padding:16px 12px}
  .levels{gap:5px}.level-button{min-width:30px;height:32px}
  .rotation-config .mask{width:50px}
  .turn-option{min-width:46px;font-size:11px}
  .ice-step{min-width:44px;padding:5px}
  .ice-next{font-size:11px}
  .ice-option{flex-direction:column;gap:0}
  .ice-title{margin-left:0;margin-right:0}
}

<body>
  <div id="app"></div>
  <noscript>請使用支援 JavaScript 的瀏覽器開啟遊戲。</noscript>
  <script>
// 沿用 ../robot-relay/public/game.js 的單人規則，來源 62deeaf。
// 基本判定沿用原版；擴充成對傳送門與公開時序的怪物移動、噴火。
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.HeroRules = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
'use strict';
const COMMANDS = {
  up: { label: '向上', icon: '↑', kind: 'move' },
  right: { label: '向右', icon: '→', kind: 'move' },
  down: { label: '向下', icon: '↓', kind: 'move' },
  left: { label: '向左', icon: '←', kind: 'move' },
  take: { label: '拿劍', icon: '⚔', kind: 'action' },
  attack: { label: '攻擊', icon: '✦', kind: 'action' },
  wait: { label: '等待', icon: 'Ⅱ', kind: 'wait' }
};

const clone = value => JSON.parse(JSON.stringify(value));
const same = (a, b) => a[0] === b[0] && a[1] === b[1];
const DELTA = {up:[0,-1],right:[1,0],down:[0,1],left:[-1,0]};
const monsterAt = (level, robot) => robot.monsterPosition || level.monster;
function fireCells(level, origin, direction, range) {
  const cells=[]; let p=origin.slice();
  for(let i=0;i<range;i++) {
    p=p.map((v,j)=>v+DELTA[direction][j]);
    if(p.some(v=>v<0||v>=level.size)||level.walls.some(w=>same(w,p)))break;
    cells.push(p);
  }
  return cells;
}
function forecast(level) {
  let position=level.monster.slice();
  return (level.events||[]).map(event=>{
    const from=position.slice();
    if(event.move)position=position.map((v,i)=>v+DELTA[event.move][i]);
    return {...event,from,to:position.slice(),cells:event.fire?fireCells(level,position,event.fire.direction,event.fire.range):[]};
  });
}
function validateLevel(level) {
  if (!level || ![4, 5, 6].includes(level.size) || typeof level.name !== 'string' || !level.name.trim() || level.name.length > 40) throw new Error('地圖格式不正確。');
  const point = p => Array.isArray(p) && p.length === 2 && p.every(n => Number.isInteger(n) && n >= 0 && n < level.size);
  const objects = [level.start, level.sword, level.monster, level.goal];
  if (!objects.every(point) || !Array.isArray(level.walls) || level.walls.length > level.size ** 2 - 4 || !level.walls.every(point)) throw new Error('地圖的位置不正確。');
  if (new Set(objects.map(p => p.join(','))).size !== 4) throw new Error('起點、寶劍、怪物與出口要放在不同格。');
  if (level.walls.some(w => objects.some(p => same(p, w)))) throw new Error('重要位置不能放障礙物。');
  if (level.portals && (level.portals.length !== 2 || !level.portals.every(point) || same(...level.portals) || level.portals.some(p => [...objects, ...level.walls].some(q => same(p, q))))) throw new Error('傳送門必須是兩個獨立且空白的格子。');
  let previous=0;
  for(const event of level.events||[]) {
    if(!Number.isInteger(event.after)||event.after<1||event.after<=previous||event.after>(level.steps||20)||(!event.move&&!event.fire))throw new Error('怪物時序格式不正確。');
    if(event.move&&!DELTA[event.move])throw new Error('怪物移動方向不正確。');
    if(event.fire&&(!DELTA[event.fire.direction]||!Number.isInteger(event.fire.range)||event.fire.range<1||event.fire.range>level.size))throw new Error('噴火範圍不正確。');
    previous=event.after;
  }
  if(forecast(level).some(e=>!point(e.to)||level.walls.some(w=>same(w,e.to))))throw new Error('怪物路線碰到牆或超出地圖。');
  return true;
}

function initialRobot(level) { return { position: [...level.start], hasSword: false, monsterDefeated: false, escaped: false, failed: false, ...(level.events?.length ? {turn:0,monsterPosition:level.monster.slice()} : {}) }; }
function stepRobot(level, robot, command) {
  const next = clone(robot);
  const monster=monsterAt(level,robot);
  if (!Object.hasOwn(COMMANDS, command)) throw new Error('未知指令。');
  if (next.failed) return { robot: next, message: '先修正前面的指令，再試一次。', ok: false };
  let message = '', teleport = null;
  if (['up', 'right', 'down', 'left'].includes(command)) {
    const delta = { up: [0, -1], right: [1, 0], down: [0, 1], left: [-1, 0] }[command];
    const target = next.position.map((n, i) => n + delta[i]);
    if (target.some(n => n < 0 || n >= level.size)) message = '走到地圖邊緣了！換個方向試試。';
    else if (level.walls.some(w => same(w, target))) message = '前面有石牆，換條路走吧。';
    else if (same(target, monster) && !next.monsterDefeated) message = '怪物擋住了路！先拿劍，站在牠旁邊攻擊。';
    else if (same(target, level.goal) && !next.monsterDefeated) message = '出口還沒打開，先拿劍打敗怪物。';
    else { next.position = target; message = `${COMMANDS[command].label}走一格。`; }
    if (!same(next.position, target)) next.failed = true;
    if (!next.failed && level.portals) {
      const entrance = level.portals.findIndex(p => same(p, target));
      if (entrance >= 0) {
        next.position = level.portals[1 - entrance].slice();
        teleport = { from: target, to: next.position.slice() };
        message = `${COMMANDS[command].label}走進傳送門，到另一個紫色圈。`;
        if(!next.monsterDefeated&&same(next.position,monster)){next.failed=true;message='傳送的另一端有怪物！要先看牠這一步的位置。';}
      }
    }
  } else if (command === 'take') {
    if (next.hasSword) message = '已經拿到劍了，接著找怪物吧。';
    else if (!same(next.position, level.sword)) message = '這裡沒有寶劍。先走到寶劍那格，再按拿劍。';
    else { next.hasSword = true; message = '拿到寶劍！去找擋路的怪物。'; }
    if (!next.hasSword || robot.hasSword) next.failed = true;
  } else if (command === 'attack') {
    const distance = next.position.reduce((sum, n, i) => sum + Math.abs(n - monster[i]), 0);
    if (!next.hasSword) message = '還沒有寶劍，先拿到劍才能攻擊。';
    else if (next.monsterDefeated) message = '怪物已經逃走了，前往出口吧。';
    else if (distance !== 1) message = '離怪物太遠了。站在牠的上、下、左或右一格再攻擊。';
    else { next.monsterDefeated = true; message = '怪物逃走了！出口打開，繼續前進。'; }
    if (!next.monsterDefeated || robot.monsterDefeated) next.failed = true;
  } else message = '停一格，等一下。我們慢慢來。';
  const effects=[],actionRobot=clone(next);
  if(level.events?.length) {
    next.turn=(robot.turn||0)+1;
    const event=level.events.find(e=>e.after===next.turn);
    if(!next.failed&&event) {
      if(next.monsterDefeated) {
        effects.push({kind:'cancel',after:next.turn,message:`怪物已被擊退，第 ${next.turn} 步後的行動已取消。`});
      } else {
        if(event.move) {
          const from=next.monsterPosition.slice(),to=from.map((v,i)=>v+DELTA[event.move][i]);
          next.monsterPosition=to;
          const hit=same(to,next.position);
          effects.push({kind:'move',after:next.turn,from,to,direction:event.move,hit,message:hit?'怪物走到勇者這格了！要預先避開牠的路線。':`怪物${COMMANDS[event.move].label}走一格。`});
          if(hit)next.failed=true;
        }
        if(event.fire&&!next.failed) {
          const from=next.monsterPosition.slice(),cells=fireCells(level,from,event.fire.direction,event.fire.range),hit=cells.some(p=>same(p,next.position));
          effects.push({kind:'fire',after:next.turn,from,cells,direction:event.fire.direction,hit,message:hit?'勇者停在噴火範圍裡了！換個位置，或等這次火熄了再過。':`怪物${COMMANDS[event.fire.direction].label}噴火，勇者在安全位置。`});
          if(hit)next.failed=true;
        }
      }
      message += ' '+effects.map(e=>e.message).join(' ');
    }
  }
  next.escaped = next.monsterDefeated && same(next.position, level.goal);
  return { robot: next, message, ok: !next.failed, ...(teleport ? { teleport } : {}), ...(level.events?.length?{actionRobot,effects}: {}) };
}

function simulate(level, commands) {
  let robot = initialRobot(level);
  const frames = [];
  for (let i = 0; i < commands.length; i++) {
    const result = stepRobot(level, robot, commands[i]);
    robot = result.robot;
    frames.push({ ...result, index: i, command: commands[i] });
    if (!result.ok) break;
  }
  return { frames, success: robot.escaped && !robot.failed, robot };
}

function solveLevel(level) {
  validateLevel(level);
  const queue = [{ robot: initialRobot(level), path: [] }];
  const seen = new Set();
  for (let i = 0; i < queue.length; i++) {
    const { robot, path } = queue[i];
    if (robot.escaped) return path;
    const key = `${robot.position}:${robot.hasSword}:${robot.monsterDefeated}:${robot.monsterPosition||''}:${Math.min(robot.turn||0,level.events?.at(-1)?.after||0)}`;
    if (seen.has(key)) continue;
    seen.add(key);
    for (const command of Object.keys(COMMANDS).filter(c => c !== 'wait' || level.events?.length)) {
      const { robot: next, ok } = stepRobot(level, robot, command);
      if (ok) queue.push({ robot: next, path: [...path, command] });
    }
  }
  return null;
}


// BFS 同時統計最短解數；不以 7^步數 窮舉全部指令。

  };

  function optionsFor(game, level) {
    if (game === 'animal') return Array.from({length:4},()=>Object.keys(A.actions));
    if (game === 'sticker') return level.masks.map(() => level.palette);
    if (game === 'hero') return level.editable.map(() => level.commands || Object.keys(H.COMMANDS));
    return Array.from({length: level.steps}, () => level.directions || Object.keys(P.directions));
  }
  function rotateMask(mask, cols, rows, turns) {
    if (cols !== rows) throw new Error('旋轉貼紙必須使用正方形。');
    return mask.map(cell => {
      let x = cell % cols, y = Math.floor(cell / cols);
      for (let i = 0; i < turns; i++) [x, y] = [cols - 1 - y, x];
      return y * cols + x;
    }).sort((a, b) => a - b);
  }
  function expandHero(level, settings) {
    const program = level.program.slice();
    level.editable.forEach((slot, i) => { program[slot] = settings[i]; });
    return program;
  }
  function rotateBoard(board, cols, rows) {
    const result=Array(board.length).fill(null);
    board.forEach((value,i)=>{result[rotateMask([i],cols,rows,1)[0]]=value;});
    return result;
  }
  function defaults(game, level) {
    // 留空的設定不會被當成答案；學生先主動為每個部件做選擇。
    return optionsFor(game, level).map(() => null);
  }
  function validate(game, level, settings) {
    const opts = optionsFor(game, level);
    if (!Array.isArray(settings) || settings.length !== opts.length || settings.some((v, i) => !opts[i].includes(v))) throw new Error('請先完成每個設定。');
  }
  function runSticker(level, settings) {
    let board = Array(level.cols * level.rows).fill(null);
    let owners=board.slice();
    const frames = [];
    level.masks.forEach((mask, i) => {
      board = board.slice();
      owners=owners.slice();
      const color=settings[i];
      mask.forEach(cell => { board[cell] = color; owners[cell]=i; });
      frames.push({type:'stamp',machine:i,color,mask,board});
      if(level.rotateAfter===i+1) {
        const before=board;
        board=rotateBoard(board,level.cols,level.rows);
        owners=rotateBoard(owners,level.cols,level.rows);
        frames.push({type:'rotate',after:i+1,before,board});
      }
    });
    const wrong = board.map((v, i) => v === level.target[i] ? -1 : i).filter(i => i >= 0);
    return { success: wrong.length === 0, frames, board, wrong, owners };
  }
  function run(game, level, settings) {
    validate(game, level, settings);
    if (game === 'sticker') return runSticker(level, settings);
    if (game === 'hero') return H.simulate(level, expandHero(level, settings));
    if (game === 'animal') return A.run(level, settings);
    return P.run(level, settings);
  }
  function solutions(game, level) {
    const opts = optionsFor(game, level), found = [];
    function visit(values) {
      if (values.length === opts.length) { if (run(game, level, values).success) found.push(values); return; }
      opts[values.length].forEach(v => visit([...values, v]));
    }
    visit([]);
    return found;
  }
  return { colors, games, groups, groupFor, attemptFor, defaults, optionsFor, run, solutions, rotateMask, rotateBoard, expandHero, hero: H, penguin: P, animal: A };

    } else if (state.game === 'penguin') {
      message = result.success ? `${l.steps} 次滑行結束，${l.boards.length === 1 ? '小紅已經' : '兩隻企鵝都'}停在家裡！` : `${l.steps} 次滑行結束，${result.arrived.filter(Boolean).length} / ${l.boards.length} 隻停在家裡。看看哪一步開始，位置和你想的不一樣。`;
      reflection = l.boards.length === 1 ? '想一想：這次是冰塊，還是邊界幫你停下來？' : '想一想：同一個方向，為什麼兩隻滑的距離不一樣？哪一次要讓一隻先停下？';
      log = result.frames.map(f => `第 ${f.index + 1} 次${R.penguin.directions[f.command].label}：${penguinStepText(f)}。`);
    } else {
      const last = result.frames[result.frames.length - 1];
      message = result.success ? `四個空格接上了已排好的指令。勇者走完 ${l.steps} 步，拿到劍、打敗怪物，也走到了出口！` : result.robot.failed ? `第 ${last.index + 1} 步「${R.hero.COMMANDS[last.command].label}」：${last.message}` : '指令用完了，勇者還沒走到出口。想想哪一段可以改變。';
      reflection = '想一想：哪些已排好的指令，能幫你推理前面的空格？';
      log = result.frames.map(f => `第 ${f.index + 1} 步 ${R.hero.COMMANDS[f.command].label}：${f.message}`);
    }
    const next = state.index < games[state.game].levels.length - 1;
    return `<div class="result ${result.success ? 'success' : ''}" data-success="${result.success}"><h3>${result.success ? '✓ 計畫成功！' : '再想一下，找到新線索了'}</h3><p>${message}</p><details style="margin-top:10px;font-size:18px;line-height:1.85"><summary style="cursor:pointer">看看這次的過程</summary><ol style="padding-left:20px;margin-bottom:8px">${log.map(text => `<li>${text}</li>`).join('')}</ol></details><div class="reflection">${result.success ? reflection : '設定都還在。改一個地方，再播放看看會有什麼不同。'}</div>${result.success ? `<button class="secondary next" data-action="${next ? 'next' : 'home'}">${next ? '下一個挑戰 →' : '這一區完成了！回遊戲選單 →'}</button>` : ''}</div>`;
  }
  async function play() {
    if (!state || state.running || !isComplete()) return;
    const token = ++runToken, l = level();
    state.running = true; state.paused = false; state.result = null;
    const result = R.run(state.game, l, state.settings.slice());
    renderGame();
    app.querySelector('.board-content').scrollIntoView({ block: 'start', behavior: 'auto' });
    const finished = await ({ sticker: playSticker, hero: playHero, penguin: playPenguin, animal: playAnimal })[state.game](l, result, token);
    if (!finished || token !== runToken) return;
    state.running = false; state.result = result;
    if (result.success) markComplete(l.id);
    activeMachine(-1);
    app.querySelectorAll('[data-machine], [data-command], [data-hero-slot], [data-clear-slot], [data-action="clear"]').forEach(e => { e.disabled = false; });
    app.querySelector('[data-action="pause"]')?.remove();
    app.querySelectorAll('[data-command]').forEach(e => e.draggable = true);
    const playButton = document.getElementById('play-button');
    playButton.dataset.action = 'play'; playButton.textContent = '↻ 再播放一次';
    document.getElementById('status').textContent = '播放結束。可以直接修改設定，繼續試試。';
    document.getElementById('result').innerHTML = resultMarkup(l, result);
    if (result.success) app.querySelector(`[data-level="${state.index}"]`).classList.add('completed');
    if (window.innerWidth <= 680) app.querySelector('.action-panel').scrollIntoView({ block: 'center', behavior: reducedMotion.matches ? 'auto' : 'smooth' });
  }
  app.addEventListener('click', event => {
    const button = event.target.closest('[data-action],[data-game],[data-level],[data-machine],[data-command],[data-hero-slot],[data-clear-slot]');
    if (!button || button.disabled) return;
    if (button.dataset.game) { openGame(button.dataset.game); return; }
    if (button.dataset.action === 'home') { home(); return; }
    if (!state) return;
    if (button.dataset.level !== undefined) { openGame(state.game, Number(button.dataset.level)); return; }
    if (button.dataset.machine !== undefined) {
      const choice = button.dataset.choice;
      select(Number(button.dataset.machine), choice); return;
    }
    if (state.game === 'hero' && !state.running) {
      if (button.dataset.heroSlot !== undefined) { chooseHeroSlot(Number(button.dataset.heroSlot)); return; }
      if (button.dataset.command) { placeHeroCommand(button.dataset.command); return; }
      if (button.dataset.clearSlot !== undefined) { clearHeroSlot(Number(button.dataset.clearSlot)); return; }
    }
    switch (button.dataset.action) {
      case 'play': play().catch(error => {
        console.error(error);
        if (!state) return;
        ++runToken; state.running = false; renderGame();
        document.getElementById('status').textContent = '播放暫停了，設定仍保留。請再播放一次。';
      }); break;
      case 'stop': ++runToken; state.running = false; state.paused = false; state.result = null; renderGame(); break;
      case 'pause': state.paused = !state.paused; button.textContent = state.paused ? '繼續' : '暫停'; document.getElementById('status').textContent = state.paused ? '暫停中，可以慢慢看目前的位置。' : '繼續播放你的計畫…'; break;
      case 'speed': saved.speed = saved.speed === 1 ? 2 : 1; save(); button.textContent = saved.speed + '×'; button.setAttribute('aria-label', `切換播放速度，目前 ${saved.speed} 倍`); break;
      case 'clear': state.selectedSlot = 3; state.settings = R.defaults(state.game, level()); state.result = null; saved.drafts[level().id] = state.settings.slice(); save(); renderGame(); break;
      case 'next': openGame(state.game, state.index + 1); break;
    }
  });
  app.addEventListener('keydown', event => {
    if (!state || state.game !== 'hero' || state.running || event.ctrlKey || event.altKey || event.metaKey || event.target.matches('input,textarea,select')) return;
    const directions = { ArrowUp: 'up', ArrowRight: 'right', ArrowDown: 'down', ArrowLeft: 'left' };
    if (directions[event.key]) { event.preventDefault(); placeHeroCommand(directions[event.key]); }
    if (event.key === 'Delete' || event.key === 'Backspace') { event.preventDefault(); clearHeroSlot(state.selectedSlot); }
  });
  app.addEventListener('dragstart', event => {
    const command = event.target.closest('[data-command]');
    if (!command || !state || state.running) { event.preventDefault(); return; }
    event.dataTransfer.setData('text/plain', command.dataset.command);
    event.dataTransfer.effectAllowed = 'copy';
  });
  app.addEventListener('dragover', event => {
    if (state?.game === 'hero' && !state.running && event.target.closest('[data-hero-slot]')) event.preventDefault();
  });
  app.addEventListener('drop', event => {
    const slot = event.target.closest('[data-hero-slot]');
    if (!slot || state?.game !== 'hero' || state.running) return;
    event.preventDefault();
    placeHeroCommand(event.dataTransfer.getData('text/plain'), Number(slot.dataset.heroSlot));
  });
  home();
})();

</script>
</body>
</html>
