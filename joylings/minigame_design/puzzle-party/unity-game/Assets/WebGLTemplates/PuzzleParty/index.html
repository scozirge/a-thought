<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><title>一起想想｜四組合作解謎</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#f5f5ed;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#315648}canvas{display:block;width:100vw;height:100dvh;touch-action:none;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#f5f5ed;gap:14px}progress{width:280px;height:16px;accent-color:#386f59}p,small{font-size:18px}small{color:#596b55}#error{max-width:640px;padding:24px;white-space:pre-wrap}</style></head>
<style>
dialog{width:min(620px,calc(100vw - 24px));max-height:calc(100dvh - 28px);overflow:auto;border:1px solid #cbd8c5;border-radius:20px;padding:24px;background:#fffef8;color:#294e45;font:18px/1.6 system-ui,"Microsoft JhengHei",sans-serif}dialog::backdrop{background:#17372e75}dialog h2{font-size:28px;margin:0 0 10px}dialog p{margin:10px 0 18px}dialog label{display:block;margin:12px 0 5px;font-weight:600}dialog input,dialog select,dialog button{font:inherit;font-size:20px;min-height:48px;border:1px solid #c5d3be;border-radius:9px;padding:9px 12px;color:#294e45;background:white}dialog input,dialog select{width:100%}dialog button{cursor:pointer}dialog button:disabled{opacity:.55;cursor:wait}.room-primary{background:#306d5c;color:white;border-color:#306d5c}.room-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.room-row button{flex:1}.room-divider{border-top:1px solid #dbe2d4;margin:22px 0 12px;padding-top:16px}.room-number{font-size:42px;letter-spacing:6px;color:#306d5c;font-weight:750}.room-members{padding:0;list-style:none}.room-members li{padding:9px 12px;margin:8px 0;border-radius:9px;background:#edf3e7}.room-error{color:#a84127;min-height:29px}#room-close{float:right;border:0;background:#edf2e5;padding:4px 14px}#room-wait{color:#557646}.room-list{display:grid;gap:10px;margin:12px 0}.room-option{text-align:left;overflow-wrap:anywhere}.room-option[aria-pressed="true"]{outline:3px solid #306d5c;background:#edf3e7}.room-members li,#room-identity{overflow-wrap:anywhere}dialog [hidden]{display:none!important}
</style>
<body><canvas id="unity-canvas" tabindex="0" aria-label="一起想想：兩款各 20 關，四組各選一次"></canvas><div id="loading"><h1>一起想想</h1><p>準備中…</p><progress id="progress" max="1" value="0"></progress><small></small><div id="error"></div></div>
<dialog id="room-dialog" aria-labelledby="room-title">
 <button id="room-close" aria-label="關閉連線視窗">×</button><h2 id="room-title">連線教室</h2>
 <div id="room-form"><p>老師建立房間，學生選擇老師的房間加入。<br>依加入順序自動分配第 1、2、3 組，每組選一次。</p>
 <label for="room-name">組別名稱（老師與學生都要填）</label><input id="room-name" maxlength="16" placeholder="輸入組別名稱，例如：小兔" autocomplete="off" required><small>畫面會顯示你填的名稱</small>
 <div class="room-row"><button class="room-primary" id="room-create">我是老師 · 建立房間</button></div>
 <div class="room-divider">我是學生 · 選擇老師的房間</div>
 <div class="room-row"><button id="room-refresh">重新整理房間</button></div>
 <p id="room-list-status" role="status"></p><div id="room-list" class="room-list" role="group" aria-label="老師的房間"></div>
 <p id="room-selected" role="status">請先選擇房間。</p>
 <div class="room-row"><button class="room-primary" id="room-join" disabled>加入選取的房間</button></div>
 </div>
 <div id="room-connected" hidden><p id="room-identity"></p><div>學生可在房間清單選擇這個房間</div><div class="room-number" id="room-number"></div><ul id="room-members" class="room-members"></ul><p>開題時分配：學生在前，老師負責剩下的後段。老師離開時，房間就會結束。</p><div class="room-row"><button id="room-copy">複製房間連結</button></div></div>
 <div class="room-row"><button id="room-solo">返回單機</button></div>
 <p id="room-wait" role="status"></p><p id="room-error" class="room-error" role="alert"></p>
</dialog>
<script>
(()=>{const el=id=>document.getElementById(id),dialog=el('room-dialog');let lastConnected=false,returningSolo=false,selectedCode='',listKey='',memberKey='',lastState={};
 const send=request=>{if(!window.unityInstance)return;window.unityInstance.SendMessage('PuzzleParty','RoomCommand',JSON.stringify(request));};
 const browse=()=>send({type:'browse'});
 window.puzzleOpenRoom=()=>{if(!dialog.open)dialog.showModal();if(!lastState.connected&&!lastState.busy)browse();};
 el('room-close').onclick=()=>{dialog.close();el('unity-canvas').focus();};
 const name=()=>{const value=el('room-name').value.trim();if(!value){el('room-error').textContent='請輸入組別名稱。';el('room-name').focus();return null;}return value;};
 const connect=(type,code)=>{const value=name();if(value===null)return;el('room-error').textContent='';el('room-wait').textContent='正在連線…';el('room-create').disabled=el('room-join').disabled=true;send({type,code,name:value});};
 el('room-create').onclick=()=>connect('create');
 el('room-join').onclick=()=>{if(!(lastState.rooms||[]).some(r=>r.code===selectedCode&&r.open)){el('room-error').textContent='請選擇可加入的老師房間。';return;}connect('join',selectedCode);};
 el('room-refresh').onclick=browse;
 el('room-solo').onclick=()=>{returningSolo=true;el('room-solo').disabled=true;send({type:'leave'});};
 el('room-copy').onclick=async()=>{const url=new URL(location.href);url.searchParams.set('room',lastState.code);try{await navigator.clipboard.writeText(url.href);el('room-wait').textContent='已複製房間連結，傳給學生就可以了。';}catch{el('room-wait').textContent='房號：'+lastState.code;}};
 const team=m=>m.name;
 function renderList(s){
  const rooms=s.rooms||[],chosen=rooms.find(r=>r.code===selectedCode&&r.open);
  el('room-join').disabled=s.busy||s.lobbyBusy||!chosen;
  el('room-selected').textContent=chosen?'已選擇：'+chosen.name+' 小隊的房間 · '+chosen.code:'請先選擇房間。';
  el('room-refresh').disabled=s.busy||s.lobbyBusy;
  el('room-list-status').textContent=s.lobbyBusy?'正在取得房間清單…':s.lobbyError||(!s.lobbyReady?'按重新整理取得房間清單。':rooms.length?'第一個加入是第1組，接著是第2、3組。':'目前沒有老師開房，請等老師建立房間後重新整理。');
  const key=JSON.stringify([rooms,selectedCode,!!s.busy,!!s.lobbyBusy]);if(key===listKey)return;listKey=key;
  const list=el('room-list');list.replaceChildren();for(const r of rooms){const button=document.createElement('button');button.type='button';button.className='room-option';button.dataset.code=r.code;button.setAttribute('aria-pressed',String(r.code===selectedCode));button.disabled=s.busy||s.lobbyBusy||!r.open;button.textContent=r.name+' 小隊的房間 · '+r.code+' · 學生 '+r.students+'/3 組'+(r.open?'':' · 已滿或關閉');button.onclick=()=>{selectedCode=r.code;renderList(lastState);};list.append(button);}
 }
 window.puzzleRenderRoom=s=>{
  lastState=s;el('room-solo').disabled=returningSolo;
  if(returningSolo&&!s.busy&&!s.connected){returningSolo=false;lastConnected=false;dialog.close();el('unity-canvas').focus();el('room-solo').disabled=false;}
  el('room-form').hidden=s.connected;el('room-connected').hidden=!s.connected;
  if(s.error)el('room-error').textContent=s.error;else if(s.connected)el('room-error').textContent='';
  el('room-create').disabled=s.busy;
  if(s.busy)el('room-wait').textContent='正在連線，請稍等…';else if(el('room-wait').textContent.startsWith('正在'))el('room-wait').textContent='';
  if(s.connected){el('room-number').textContent=s.code;const me=(s.members||[]).find(m=>m.group===s.myGroup);el('room-identity').textContent=(me?team(me):'')+(s.isHost?'':(s.mySlot<0?' · 本題已開始，下一題再分配。':' · 負責第 '+(s.mySlot+1)+' 步。'));
   const key=JSON.stringify([s.members,s.slotGroups,s.slotReady,s.isHost]);
   if(key!==memberKey){memberKey=key;const list=el('room-members');list.replaceChildren();for(const m of s.members||[]){
    const li=document.createElement('li'),text=document.createElement('span');
    const slots=(s.slotGroups||[]).map((g,i)=>g===m.group?i:-1).filter(i=>i>=0);
    text.textContent=team(m)+' · '+(slots.length?slots.map(i=>(i+1)+(s.slotReady?.[i]?' ✓':' 未選')).join('、'):'等下一題');li.append(text);
    if(s.isHost&&!m.isHost){const kick=document.createElement('button');kick.type='button';kick.textContent='踢出';kick.setAttribute('aria-label','踢出 '+m.name);kick.style.marginLeft='12px';kick.onclick=()=>send({type:'remove',playerId:m.id});li.append(kick);}
    list.append(li);
   }}
   if(!lastConnected&&!returningSolo){dialog.close();el('unity-canvas').focus();}
  }else{renderList(s);if(!returningSolo&&(lastConnected||s.error)){if(!dialog.open)dialog.showModal();if(lastConnected&&!s.busy)browse();}}
  lastConnected=s.connected;
 };
 const code=new URL(location.href).searchParams.get('room');if(code&&/^[0-9]{6}$/.test(code)){selectedCode=code;window.addEventListener('puzzle-ready',()=>window.puzzleOpenRoom());}
})();
</script>
<script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
const canvas=document.getElementById('unity-canvas');
createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'AThought',productName:'一起想想',productVersion:'0.13.0',devicePixelRatio:1},p=>document.getElementById('progress').value=p).then(instance=>{window.unityInstance=instance;
canvas.addEventListener('wheel',e=>{instance.SendMessage('PuzzleParty','Scroll',String(e.deltaY));e.preventDefault();},{passive:false});
let lastTouchY=null;
canvas.addEventListener('touchstart',e=>{lastTouchY=e.touches[0]?.clientY??null;},{passive:true});
canvas.addEventListener('touchmove',e=>{const y=e.touches[0]?.clientY;if(lastTouchY!==null&&y!==undefined&&Math.abs(lastTouchY-y)>4){instance.SendMessage('PuzzleParty','Scroll',String(lastTouchY-y));lastTouchY=y;e.preventDefault();}},{passive:false});
canvas.addEventListener('touchend',()=>{lastTouchY=null;},{passive:true});document.getElementById('loading').remove();canvas.focus();window.dispatchEvent(new Event('puzzle-ready'));}).catch(e=>{document.getElementById('error').textContent='載入失敗：'+e+'\n請重新整理，或使用附的「開始 Unity 測試.cmd」。';console.error(e);});
</script></body></html>
