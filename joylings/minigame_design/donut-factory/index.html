<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#faf4e9"><title>甜甜圈運算工廠</title><link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css"><script src="core.js" defer></script><script src="art.js" defer></script><script src="app.js" defer></script></head>
<body><main class="app">
  <header><div class="brand"><span id="logo"></span><h1>甜甜圈運算工廠</h1></div><nav id="levels" aria-label="關卡"></nav></header>
  <div class="heading"><h2 id="title"></h2><p id="task"></p></div>
  <div class="workspace">
    <section class="factory" aria-label="運算產線">
      <div class="factory-top"><span>從 X 開始</span><div class="counter"><span>目前</span><strong id="value">—</strong><span>份</span></div></div>
      <div id="flow" class="flow"></div>
      <div class="shelf"><p>把機器放進空位</p><div id="palette"></div></div>
      <div class="bottom"><div id="status" role="status" aria-live="polite"></div><div class="controls"><button id="undo">↶ 上一步</button><button id="reset">↺ 重來</button><button id="play" class="primary">▶ 試跑</button><button id="next" class="primary" hidden>下一關 →</button></div></div>
    </section>
    <aside class="orders"><h2>訂單</h2><div id="orders"></div><div class="parcel"><span id="parcel-art"></span><div><span>這一盒</span><strong id="parcel-number">—</strong></div></div><p id="progress"></p></aside>
  </div><footer>六年級挑戰 · 本地試玩 0.2</footer>
</main></body></html>
