<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5eb"><link rel="icon" href="data:,"><title>貓狗一起回家｜雙人連線</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>貓狗一起回家</h1><nav><select id="levels" aria-label="選擇關卡"></select><button id="restart">重來</button><button id="room-open">連線</button><button id="fullscreen" aria-label="全螢幕">⛶</button></nav></header>
<section id="teacher" hidden><button id="demo">▶ 播放解題</button><button id="stop" hidden>■ 停止</button><button id="tips">看解答</button><span id="demo-status"></span></section>
<div class="status"><strong id="keys">鑰匙 0 / 1</strong><span id="mechanic"></span><strong id="home">到家 0 / 2</strong><span id="identity">同機雙人</span></div>
<main id="stage"><canvas id="unity-canvas" tabindex="0" aria-label="貓狗合作遊戲"></canvas><div id="result" hidden><strong id="result-title"></strong><div><button id="retry">再玩一次</button><button id="next">下一關</button></div></div><div id="waiting" hidden role="status"></div><button id="skip" hidden>略過動畫</button></main>
<section id="controls" aria-label="操作"><div class="controller"><button id="actor" aria-label="手機操控角色">🐱 貓咪</button><div id="stick" role="group" aria-label="左右移動搖桿"><span class="stick-arrows" aria-hidden="true">←　→</span><span id="knob" aria-hidden="true"></span></div></div><div class="keyboard-help"><span>貓咪 A D 移動 · W 跳</span><span>狗狗 ← → 移動 · ↑ 跳</span><small id="owner-keys"></small></div><div class="actions"><button id="jump" data-bit="4">跳躍</button><button id="flip" data-bit="8" hidden>翻朋友</button></div></section>
<dialog id="room-dialog" aria-labelledby="room-title"><button class="close" id="room-close" aria-label="關閉連線視窗">×</button><h2 id="room-title">找朋友一起玩</h2><div id="room-form"><label for="player-name">你的名字</label><input id="player-name" maxlength="16" autocomplete="off" placeholder="例如：小花"><button class="primary wide" id="create">開房當貓咪</button><label for="room-code">朋友的六位房號</label><div class="join-row"><input id="room-code" inputmode="numeric" maxlength="6" autocomplete="off"><button id="join">加入當狗狗</button></div><button id="browse">找房間</button><p id="list-status" role="status"></p><div id="room-list"></div></div><div id="room-connected" hidden><p id="room-role"></p><strong id="code"></strong><p id="members"></p><button id="copy">複製邀請</button></div><p id="room-status" role="status"></p><p id="room-error" role="alert"></p><button id="leave" class="wide">返回同機</button></dialog>
<dialog id="answer-dialog" aria-labelledby="answer-title"><button class="close" id="answer-close" aria-label="收起解答">×</button><h2 id="answer-title"></h2><ol id="answer-steps"></ol></dialog>
<div id="loading"><h1>貓狗一起回家</h1><p>準備一起出發…</p><progress id="progress" max="1" value="0"></progress><p id="load-error" role="alert"></p></div>
<script src="controller.js"></script><script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
createUnityInstance(document.getElementById('unity-canvas'),{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'AThought',productName:'貓狗一起回家',productVersion:'1.0.0',devicePixelRatio:1,cacheControl:url=>url.includes('?v=')?'immutable':'must-revalidate'},p=>document.getElementById('progress').value=p).then(instance=>{window.unityInstance=instance;window.configureTogether();document.getElementById('loading').remove();}).catch(error=>{document.getElementById('load-error').textContent='載入失敗，請重新整理後再試。';console.error(error);});
</script></body></html>
